<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Newton Gakuya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 8rem;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff, 0 0 60px #00cccc;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #0099ff;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #e0e0e0;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #00ffff, #0099ff);
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.6);
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 30px #00ffff, 0 0 60px #00cccc;
            }
            50% {
                text-shadow: 0 0 40px #00ffff, 0 0 80px #00cccc, 0 0 100px #0099ff;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>The page you're looking for seems to have wandered off into the digital void. Let's get you back on track!</p>
        <a href="/" class="btn">Go Home</a>
    </div>
</body>
</html>
